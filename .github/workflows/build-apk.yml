name: Build PlayJava Minecraft APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PlayJava
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout Amethyst Minecraft runtime base
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          ref: 1.1.7
          path: amethyst
          submodules: recursive

      - name: Patch Microsoft OAuth token exchange
        run: |
          FILE="amethyst/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/authenticator/microsoft/MicrosoftBackgroundLogin.java"
          test -f "$FILE"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("amethyst/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/authenticator/microsoft/MicrosoftBackgroundLogin.java")
          s = p.read_text()
          old = '"redirect_url", "https://login.live.com/oauth20_desktop.srf",'
          new = '"redirect_uri", "https://login.live.com/oauth20_desktop.srf",'
          if old not in s:
              raise SystemExit("Expected OAuth parameter was not found; refusing to build an unverified patch")
          p.write_text(s.replace(old, new, 1))
          PY
          grep -n 'redirect_uri.*oauth20_desktop' "$FILE"

      - name: Verify Microsoft authentication source
        run: |
          test -f amethyst/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/authenticator/microsoft/MicrosoftBackgroundLogin.java
          grep -q '"redirect_uri"' amethyst/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/authenticator/microsoft/MicrosoftBackgroundLogin.java

      - name: Build Minecraft Java launcher
        working-directory: amethyst
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      - name: Prepare PlayJava APK
        run: |
          mkdir -p app/build/outputs/apk/debug
          APK=$(find amethyst/app_pojavlauncher/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" app/build/outputs/apk/debug/PlayJava-debug.apk

      - name: Upload PlayJava APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayJava-Minecraft-debug
          path: app/build/outputs/apk/debug/PlayJava-debug.apk

      - name: Upload build information
        uses: actions/upload-artifact@v4
        with:
          name: PlayJava-build-info
          path: amethyst/README.md
