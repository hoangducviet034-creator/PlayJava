name: Build PlayJava Minecraft APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PlayJava
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout Amethyst Minecraft runtime base
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          ref: v3_openjdk
          path: amethyst
          submodules: recursive

      - name: Build Minecraft Java launcher
        working-directory: amethyst
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      - name: Prepare PlayJava APK
        run: |
          mkdir -p app/build/outputs/apk/debug
          cp amethyst/app_pojavlauncher/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/PlayJava-debug.apk

      - name: Upload PlayJava APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayJava-Minecraft-debug
          path: app/build/outputs/apk/debug/PlayJava-debug.apk

      - name: Upload build information
        uses: actions/upload-artifact@v4
        with:
          name: PlayJava-build-info
          path: amethyst/README.md
